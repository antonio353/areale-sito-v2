<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pannello prenotazioni — Areale</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=11">
<style>
  .admin-wrap{ padding: 40px 0 80px; }
  .admin-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:20px; margin-bottom:32px;
  }
  .admin-head p{ color: var(--ink-soft); margin:0.3em 0 0; }
  .stat-cards{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:16px; margin-bottom:32px;
  }
  .stat-card{
    border:1px solid var(--line); background:var(--paper);
    padding:18px 20px; border-radius: var(--radius);
  }
  .stat-card b{ display:block; font-family:var(--display); font-size:1.8rem; color:var(--garnet); line-height:1; }
  .stat-card span{ color:var(--ink-soft); font-size:0.85rem; }
  .filters{
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
    margin-bottom:22px;
  }
  .filters select{ min-width:180px; }
  .filters .spacer{ flex:1; }
  table.admin-table{
    width:100%; border-collapse:collapse; background:var(--paper);
    border:1px solid var(--line); font-size:0.92rem;
  }
  table.admin-table th, table.admin-table td{
    text-align:left; padding:12px 14px; border-bottom:1px solid var(--line-soft);
    vertical-align: top;
  }
  table.admin-table th{
    background: var(--stone-deep); font-weight:600; font-size:0.82rem;
    text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft);
  }
  table.admin-table tr:last-child td{ border-bottom:none; }
  .pill{
    display:inline-block; font-size:0.78rem; font-weight:600;
    padding:0.25em 0.7em; border-radius:999px; white-space:nowrap;
  }
  .pill.nuova{ background:#EFE1C2; color:#6B4E12; }
  .pill.confermata{ background:#DCEAE0; color:#1F5C39; }
  .pill.annullata{ background:#F3D9D9; color:#8C2C2C; }
  .row-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row-actions select{ font-size:0.82rem; padding:0.4em 0.5em; }
  .btn-del{
    background:transparent; border:1px solid var(--garnet); color:var(--garnet);
    font-size:0.78rem; padding:0.35em 0.7em; border-radius:var(--radius); cursor:pointer;
  }
  .btn-del:hover{ background:var(--garnet); color:var(--paper); }
  .empty-state{ padding:40px; text-align:center; color:var(--ink-soft); }
  .note-cell{ max-width:220px; white-space:pre-wrap; }
  code.small{ font-size:0.85em; color:var(--ink-soft); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a href="index.html" class="brand">Areale <small>ASSOCIAZIONE&nbsp;CULTURALE</small></a>
    <nav class="main-nav">
      <a href="admin.html" class="current">Prenotazioni</a>
      <a href="admin-eventi.html">Appuntamenti</a>
      <a href="index.html">Torna al sito</a>
    </nav>
  </div>
</header>

<div class="wrap admin-wrap">
  <div class="admin-head">
    <div>
      <span class="legend"><span class="dot"></span>Area riservata</span>
      <h1 class="mt-0">Pannello prenotazioni</h1>
      <p>Le richieste arrivate dal modulo "Prenota una serata" del sito.</p>
    </div>
    <a id="export-link" href="/api/prenotazioni/export.csv" class="btn btn-outline">Esporta CSV</a>
  </div>

  <div class="stat-cards" id="stat-cards"></div>

  <div class="filters">
    <select id="filtro-evento">
      <option value="">Tutte le serate</option>
      <option value="barolo-barbaresco">Barolo e Barbaresco vista mare</option>
      <option value="altro">Un'altra serata / non sicuro</option>
    </select>
    <select id="filtro-stato">
      <option value="">Tutti gli stati</option>
      <option value="nuova">Nuova</option>
      <option value="confermata">Confermata</option>
      <option value="annullata">Annullata</option>
    </select>
    <div class="spacer"></div>
    <span class="form-note mt-0" id="ultimo-agg"></span>
    <button type="button" class="btn btn-outline" id="btn-refresh">Aggiorna</button>
  </div>

  <div id="table-holder">
    <p class="empty-state">Caricamento…</p>
  </div>
</div>

<script src="admin.js?v=1"></script>
</body>
</html>
